server:
  port: 8080

spring:
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/ecommerce_minimal?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: root
    password: 123456
  sql:
    init:
      mode: never
  data:
    redis:
      host: 127.0.0.1
      port: 6380
  cache:
    type: redis
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:true}
          starttls:
            enable: ${MAIL_STARTTLS_ENABLE:true}
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

app:
  cache:
    enabled: ${APP_CACHE_ENABLED:true}
  mail:
    from: ${MAIL_FROM:${MAIL_USERNAME:}}

mybatis:
  mapper-locations: classpath:mappers/*.xml
  configuration:
    map-underscore-to-camel-case: true
