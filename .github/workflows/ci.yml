name: CI

on:
  push:
    branches: ['*']
  pull_request:
    branches: [main]

jobs:
  backend-test:
    name: Backend Maven Test
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root123
          MYSQL_DATABASE: ecommerce_minimal
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -uroot -proot123"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      SPRING_DATASOURCE_URL: jdbc:mysql://127.0.0.1:3306/ecommerce_minimal?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&createDatabaseIfNotExist=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root123
      SPRING_DATA_REDIS_HOST: 127.0.0.1
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_SQL_INIT_MODE: always
      MAIL_HOST: localhost
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Init database schema
        run: |
          mysql -h 127.0.0.1 -uroot -proot123 < backend/legacy-web/src/main/resources/schema.sql
          mysql -h 127.0.0.1 -uroot -proot123 < backend/legacy-web/src/main/resources/data.sql
      - name: Run Maven tests
        run: mvn test -B

  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        project: [shop-web, admin-web]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/${{ matrix.project }}/package-lock.json
      - name: Install & Build
        working-directory: frontend/${{ matrix.project }}
        run: |
          npm ci
          npm run build

  frontend-test:
    name: Frontend Unit Test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        project: [shop-web, admin-web]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/${{ matrix.project }}/package-lock.json
      - name: Install & Test
        working-directory: frontend/${{ matrix.project }}
        run: |
          npm ci
          npx vitest run
